name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run tests
        run: python sync_tests.py

      - name: Check syntax
        run: python -m compileall -q \
          cli.py fs_sync.py main.py sync_logging.py sync_tests.py